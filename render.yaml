services:
  # ─── BACKEND WEB SERVICE ──────────────────────────────
  - type: web
    name: tutor-management-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false

  # ─── FRONTEND STATIC SITE ─────────────────────────────
  - type: web
    name: tutor-management-frontend
    env: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
